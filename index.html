<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e91e63" />
  <title>小昕 · 个人工作台</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>" />
</head>
<body>
  <!-- 手机端顶部栏 -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="菜单">☰</button>
    <div class="topbar-title">小昕工作台</div>
    <button id="themeBtn" class="icon-btn" aria-label="切换主题">🌗</button>
    <button id="settingsBtnTop" class="icon-btn" aria-label="设置">⚙️</button>
  </header>

  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brandMascot"></div>
        <div class="brand-text">
          <div class="brand-name">小昕工作台</div>
          <div class="brand-sub" id="brandDate">—</div>
        </div>
      </div>

      <nav class="nav" id="nav"><!-- JS 注入 8 个模块入口 --></nav>

      <div class="sidebar-foot">
        <button id="settingsBtnSide" class="ghost-btn">⚙️ 设置 / 数据备份</button>
        <button id="themeBtn2" class="ghost-btn">🌗 主题：<span id="themeLabel">自动</span></button>
        <div class="foot-tip">数据仅存本地浏览器 · 记得常备份</div>
      </div>
    </aside>

    <!-- 遮罩（手机抽屉用） -->
    <div class="scrim" id="scrim"></div>

    <!-- 主内容 -->
    <main class="main">
      <div class="main-head">
        <div>
          <div class="mh-date" id="mainDate">—</div>
          <div class="mh-sub" id="mainLunar">—</div>
        </div>
        <div class="mh-greet" id="greet">你好呀</div>
      </div>
      <section id="view" class="view"><!-- 模块内容由 JS 渲染 --></section>
    </main>
  </div>

  <script src="assets/vendor/lunar.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/daynav.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/fortune.js"></script>
  <script src="assets/js/todo.js"></script>
  <script src="assets/js/finance.js"></script>
  <script src="assets/js/spanish.js"></script>
  <script src="assets/js/english.js"></script>
  <script src="assets/js/financenews.js"></script>
  <script src="assets/js/ainews.js"></script>
  <script src="assets/js/health.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>⚙️ 设置</h2>
        <button class="icon-btn" id="settingsClose" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="set-row">
          <div>
            <div class="set-title">导出全部数据</div>
            <div class="set-sub">把全部模块的本地记录打包成 JSON 文件，便于备份或换设备迁移。</div>
          </div>
          <button class="btn" id="exportBtn">导出</button>
        </div>
        <div class="set-row">
          <div>
            <div class="set-title">导入数据</div>
            <div class="set-sub">从导出的 JSON 文件恢复（同名数据将被覆盖）。</div>
          </div>
          <label class="btn sec" style="cursor:pointer">选择文件<input type="file" id="importFile" accept="application/json" hidden></label>
        </div>
        <div class="set-row danger">
          <div>
            <div class="set-title">清除全部数据</div>
            <div class="set-sub">清空本地所有记录（含设置），操作不可恢复。</div>
          </div>
          <button class="btn danger" id="clearBtn">清除</button>
        </div>
        <div class="set-sub" style="text-align:center;padding-top:4px">当前数据仅保存在本机浏览器，导出是对抗误删 / 换设备最稳妥的方式 💾</div>
      </div>
    </div>
  </div>
</body>
</html>
